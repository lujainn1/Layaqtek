<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لياقتك - التقدم والتحليل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #16a34a;
      --primary-light: #22c55e;
      --primary-bg: #f0fdf4;
      --accent: #d97706;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
      --protein-color: #2563eb;
      --carbs-color: #d97706;
      --fat-color: #dc2626;
    }
    body { font-family: 'Tajawal', sans-serif; background: #f1f5f9; color: var(--text); min-height: 100vh; }

    /* NAV */
    .navbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .nav-left { display: flex; align-items: center; gap: 16px; }
    .nav-logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: var(--text); }
    .nav-logo span { font-size: 22px; }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-family: 'Tajawal', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .back-btn:hover { background: var(--primary-bg); color: var(--primary); border-color: #bbf7d0; }
    .period-tabs { display: flex; background: #f1f5f9; border-radius: 10px; padding: 3px; gap: 3px; }
    .period-tab {
      padding: 7px 18px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .period-tab.active { background: white; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

    /* MAIN */
    .main { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }

    /* PAGE TITLE */
    .page-title { margin-bottom: 24px; }
    .page-title h1 { font-size: 24px; font-weight: 800; color: var(--text); }
    .page-title p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    /* CARDS */
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* SUMMARY STATS ROW */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0; left: 0;
      height: 3px;
      border-radius: 16px 16px 0 0;
    }
    .stat-card.streak::before  { background: linear-gradient(90deg, #f97316, #ef4444); }
    .stat-card.logged::before  { background: linear-gradient(90deg, var(--primary-light), var(--primary)); }
    .stat-card.avg-cal::before { background: linear-gradient(90deg, #fbbf24, var(--accent)); }
    .stat-card.avg-water::before { background: linear-gradient(90deg, #38bdf8, #0284c7); }
    .stat-icon { font-size: 28px; margin-bottom: 8px; }
    .stat-value { font-size: 32px; font-weight: 800; color: var(--text); line-height: 1; }
    .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 6px; font-weight: 500; }
    .stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

    /* TWO COLUMN LAYOUT */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

    /* BAR CHART */
    .chart-area {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      height: 180px;
      position: relative;
      padding-bottom: 36px;
    }
    .chart-goal-line {
      position: absolute;
      left: 0; right: 0;
      border-top: 2px dashed #86efac;
      z-index: 1;
    }
    .chart-goal-label {
      position: absolute;
      right: 0;
      font-size: 11px;
      color: var(--primary);
      font-weight: 600;
      background: white;
      padding: 1px 4px;
      border-radius: 4px;
      transform: translateY(-50%);
    }
    .bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      height: 100%;
      justify-content: flex-end;
      position: relative;
      z-index: 2;
    }
    .bar {
      width: 100%;
      border-radius: 8px 8px 0 0;
      min-height: 4px;
      transition: height 1s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      cursor: default;
    }
    .bar.under { background: linear-gradient(180deg, #4ade80, var(--primary)); }
    .bar.over  { background: linear-gradient(180deg, #f87171, #dc2626); }
    .bar.empty { background: #e2e8f0; }
    .bar:hover::after {
      content: attr(data-tip);
      position: absolute;
      top: -32px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: white;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
      font-family: 'Tajawal', sans-serif;
      z-index: 10;
    }
    .bar-day { font-size: 11px; color: var(--text-muted); font-weight: 600; text-align: center; position: absolute; bottom: 0; }
    .bar-cal { font-size: 11px; font-weight: 700; color: var(--text); }
    .chart-empty { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px; }

    /* MACROS WEEKLY */
    .macro-row { margin-bottom: 20px; }
    .macro-row:last-child { margin-bottom: 0; }
    .macro-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .macro-name { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .macro-dot { width: 10px; height: 10px; border-radius: 50%; }
    .macro-nums { font-size: 13px; color: var(--text-muted); }
    .macro-nums strong { color: var(--text); }
    .macro-bar-bg { height: 10px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
    .macro-bar-fill { height: 100%; border-radius: 99px; transition: width 1.2s cubic-bezier(0.4,0,0.2,1); width: 0%; }
    .macro-bar-fill.protein { background: linear-gradient(90deg, #93c5fd, var(--protein-color)); }
    .macro-bar-fill.carbs   { background: linear-gradient(90deg, #fcd34d, var(--carbs-color)); }
    .macro-bar-fill.fat     { background: linear-gradient(90deg, #fca5a5, var(--fat-color)); }

    /* TOP FOODS */
    .food-rank-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .food-rank-item:last-child { border-bottom: none; }
    .rank-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .rank-num.top { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: white; }
    .food-rank-name { flex: 1; font-size: 15px; font-weight: 600; color: var(--text); }
    .food-rank-bar-wrap { flex: 1; }
    .food-rank-bar-bg { height: 6px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
    .food-rank-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--primary-light), var(--primary)); transition: width 1.2s cubic-bezier(0.4,0,0.2,1); width: 0%; }
    .food-rank-count { font-size: 13px; font-weight: 700; color: var(--text-muted); background: #f1f5f9; padding: 3px 10px; border-radius: 20px; flex-shrink: 0; }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 60px 24px; color: var(--text-muted); }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; font-weight: 500; }
    .empty-state small { font-size: 13px; margin-top: 6px; display: block; }

    /* SKELETON */
    .skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .two-col { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .main { padding: 16px 12px; }
      .navbar { padding: 0 16px; }
      .period-tabs { display: none; }
      .stat-value { font-size: 26px; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" class="back-btn">← الرئيسية</a>
      <div class="nav-logo"><span>🔥</span> لياقتك</div>
    </div>
    <div class="period-tabs">
      <button class="period-tab active" onclick="loadStats(7, this)">7 أيام</button>
      <button class="period-tab" onclick="loadStats(14, this)">14 يوم</button>
      <button class="period-tab" onclick="loadStats(30, this)">30 يوم</button>
    </div>
  </nav>

  <main class="main">
    <div class="page-title">
      <h1>📊 التقدم والتحليل</h1>
      <p id="periodLabel">آخر 7 أيام</p>
    </div>

    <!-- STATS ROW -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card streak"><div class="skeleton" style="height:80px"></div></div>
      <div class="stat-card logged"><div class="skeleton" style="height:80px"></div></div>
      <div class="stat-card avg-cal"><div class="skeleton" style="height:80px"></div></div>
      <div class="stat-card avg-water"><div class="skeleton" style="height:80px"></div></div>
    </div>

    <!-- CHART + MACROS -->
    <div class="two-col">
      <!-- DAILY CALORIES CHART -->
      <div class="card">
        <div class="card-title">📈 السعرات اليومية</div>
        <div id="calorieChart"><div class="skeleton" style="height:180px"></div></div>
      </div>

      <!-- WEEKLY MACROS -->
      <div class="card">
        <div class="card-title">💪 متوسط الماكروز اليومي</div>
        <div id="macrosSection"><div class="skeleton" style="height:180px"></div></div>
      </div>
    </div>

    <!-- TOP FOODS -->
    <div class="card">
      <div class="card-title">🏆 أكثر الأطعمة تكراراً</div>
      <div id="topFoodsSection"><div class="skeleton" style="height:160px"></div></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/progress.js"></script>
</body>
</html>
