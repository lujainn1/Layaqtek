<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لياقتك - تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #16a34a;
      --primary-light: #22c55e;
      --primary-bg: #f0fdf4;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    body {
      font-family: 'Tajawal', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      top: -10%;
      right: -5%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.08) 0%, transparent 65%);
      border-radius: 50%;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      bottom: -10%;
      left: -5%;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.07) 0%, transparent 65%);
      border-radius: 50%;
      pointer-events: none;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 32px;
      box-shadow: 0 8px 28px rgba(34, 197, 94, 0.28);
    }
    .logo h1 { color: var(--text); font-size: 32px; font-weight: 800; }
    .logo p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
    .card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 4px 32px rgba(0, 0, 0, 0.08);
    }
    .tabs {
      display: flex;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.25s;
    }
    .tab-btn.active {
      background: white;
      color: var(--text);
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }
    .form-section { display: none; }
    .form-section.active {
      display: block;
      animation: fadeInUp 0.3s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .input-wrapper { position: relative; }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
      transition: all 0.25s;
      outline: none;
      direction: rtl;
    }
    .form-group input:focus {
      border-color: var(--primary-light);
      background: var(--primary-bg);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
    }
    .form-group input::placeholder { color: #cbd5e1; }
    .form-group input[type="password"] { padding-left: 46px; }
    .toggle-password {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    .toggle-password:hover { color: var(--primary); }
    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'Tajawal', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(34, 197, 94, 0.42);
    }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .alert.show { display: flex; }
    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
    }
    .alert-success {
      background: var(--primary-bg);
      border: 1px solid #bbf7d0;
      color: var(--primary);
    }
    .features {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .feature { text-align: center; color: var(--text-muted); font-size: 12px; }
    .feature-icon { font-size: 20px; display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="logo">
      <div class="logo-icon">🔥</div>
      <h1>لياقتك</h1>
      <p>تتبع سعراتك اليومية بذكاء</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
        <button class="tab-btn" onclick="switchTab('register')">إنشاء حساب</button>
      </div>

      <!-- Login Form -->
      <div class="form-section active" id="loginSection">
        <div class="alert alert-error" id="loginError"></div>
        <div class="alert alert-success" id="loginSuccess"></div>
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="loginEmail" placeholder="example@email.com" required autocomplete="email" dir="ltr" style="text-align:right;" />
          </div>
          <div class="form-group">
            <label>كلمة المرور</label>
            <div class="input-wrapper">
              <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password" />
              <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
          <button type="submit" class="submit-btn" id="loginBtn">
            <div class="spinner" id="loginSpinner"></div>
            <span id="loginBtnText">تسجيل الدخول</span>
          </button>
        </form>
      </div>

      <!-- Register Form -->
      <div class="form-section" id="registerSection">
        <div class="alert alert-error" id="registerError"></div>
        <div class="alert alert-success" id="registerSuccess"></div>
        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label>الاسم الكامل</label>
            <input type="text" id="registerName" placeholder="أدخل اسمك الكامل" required autocomplete="name" />
          </div>
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="registerEmail" placeholder="example@email.com" required autocomplete="email" dir="ltr" style="text-align:right;" />
          </div>
          <div class="form-group">
            <label>كلمة المرور (6 أحرف على الأقل)</label>
            <div class="input-wrapper">
              <input type="password" id="registerPassword" placeholder="••••••••" required autocomplete="new-password" minlength="6" />
              <button type="button" class="toggle-password" onclick="togglePassword('registerPassword', this)">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
          <button type="submit" class="submit-btn" id="registerBtn">
            <div class="spinner" id="registerSpinner"></div>
            <span id="registerBtnText">إنشاء حساب</span>
          </button>
        </form>
      </div>

      <div class="features">
        <div class="feature"><span class="feature-icon">📊</span>تتبع السعرات</div>
        <div class="feature"><span class="feature-icon">🤖</span>تحليل بالذكاء الاصطناعي</div>
        <div class="feature"><span class="feature-icon">💧</span>تتبع الماء</div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
